services:
  signaling:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hex-signaling
    restart: unless-stopped
    environment:
      ALLOWED_ORIGINS: "*"
      STUN_URLS: "stun:stun.l.google.com:19302"
      TURN_URLS: "turn:${TURN_HOST:-155.212.168.250}:3478?transport=udp,turn:${TURN_HOST:-155.212.168.250}:3478?transport=tcp"
      TURN_USERNAME: "${TURN_USERNAME:-turnuser}"
      TURN_PASSWORD: "${TURN_PASSWORD:-turnpass}"
      ICE_TRANSPORT_POLICY: "all"
    ports:
      - "8000:8000"
    depends_on:
      - coturn

  coturn:
    image: coturn/coturn:4.6.3
    container_name: hex-coturn
    restart: unless-stopped
    command:
      - -n
      - --log-file=stdout
      - --listening-ip=0.0.0.0
      - --external-ip=${TURN_PUBLIC_IP:-155.212.168.250}
      - --realm=${TURN_REALM:-hex.local}
      - --fingerprint
      - --lt-cred-mech
      - --user=${TURN_USERNAME:-turnuser}:${TURN_PASSWORD:-turnpass}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
