<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B132B"/>
      <stop offset="1" stop-color="#1C2541"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00D1B2"/>
      <stop offset="1" stop-color="#4EA8DE"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <circle cx="1650" cy="170" r="260" fill="#00D1B2" fill-opacity="0.08"/>
  <circle cx="230" cy="920" r="320" fill="#4EA8DE" fill-opacity="0.1"/>

  <text x="140" y="260" fill="white" font-size="124" font-family="Inter, Segoe UI, Arial" font-weight="800">SHMAX</text>
  <text x="145" y="332" fill="#9FB3C8" font-size="42" font-family="Inter, Segoe UI, Arial" font-weight="500">
    Децентрализованный mesh-мессенджер
  </text>

  <g filter="url(#shadow)">
    <rect x="138" y="390" width="900" height="520" rx="24" fill="#101B38" stroke="#2A3B63" stroke-width="2"/>
    <rect x="138" y="390" width="900" height="64" rx="24" fill="#122245"/>
    <circle cx="178" cy="422" r="9" fill="#F76C6C"/>
    <circle cx="208" cy="422" r="9" fill="#F8D66D"/>
    <circle cx="238" cy="422" r="9" fill="#66E08A"/>
    <text x="280" y="432" fill="#9FB3C8" font-size="28" font-family="Inter, Segoe UI, Arial">SHMAX Desktop</text>

    <rect x="170" y="485" width="300" height="380" rx="16" fill="#0E1730"/>
    <text x="190" y="530" fill="#EAF2FF" font-size="26" font-family="Inter, Segoe UI, Arial" font-weight="700">Контакты</text>
    <rect x="190" y="555" width="260" height="62" rx="12" fill="#18284C"/>
    <rect x="190" y="630" width="260" height="62" rx="12" fill="#18284C"/>
    <rect x="190" y="705" width="260" height="62" rx="12" fill="#18284C"/>

    <rect x="500" y="485" width="500" height="380" rx="16" fill="#0E1730"/>
    <text x="528" y="530" fill="#EAF2FF" font-size="26" font-family="Inter, Segoe UI, Arial" font-weight="700">Чат</text>
    <rect x="528" y="558" width="220" height="58" rx="12" fill="#1E315C"/>
    <rect x="738" y="638" width="220" height="58" rx="12" fill="url(#accent)" fill-opacity="0.9"/>
    <rect x="528" y="718" width="320" height="58" rx="12" fill="#1E315C"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="1120" y="410" width="280" height="560" rx="36" fill="#0F1B36" stroke="#2A3B63" stroke-width="2"/>
    <rect x="1138" y="452" width="244" height="474" rx="24" fill="#101F3E"/>
    <rect x="1198" y="428" width="122" height="12" rx="6" fill="#3D527C"/>
    <text x="1170" y="500" fill="#EAF2FF" font-size="24" font-family="Inter, Segoe UI, Arial" font-weight="700">Android</text>
    <rect x="1165" y="530" width="190" height="44" rx="10" fill="#1A2D54"/>
    <rect x="1165" y="590" width="190" height="44" rx="10" fill="#1A2D54"/>
    <rect x="1165" y="650" width="190" height="44" rx="10" fill="#1A2D54"/>
    <rect x="1165" y="730" width="190" height="132" rx="14" fill="url(#accent)" fill-opacity="0.18"/>
  </g>

  <g>
    <line x1="1020" y1="640" x2="1120" y2="640" stroke="#4EA8DE" stroke-width="4" stroke-dasharray="12 10"/>
    <circle cx="1060" cy="640" r="8" fill="#00D1B2"/>
    <circle cx="1090" cy="640" r="8" fill="#00D1B2"/>
  </g>

  <text x="140" y="1010" fill="#7E96B3" font-size="30" font-family="Inter, Segoe UI, Arial">
    Web • Desktop • Android | Чаты • Группы • Видеозвонки
  </text>
</svg>
